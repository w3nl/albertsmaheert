<svg xmlns="http://www.w3.org/2000/svg" class="scene" id="sc-tuin" viewBox="0 0 1600 900"
  preserveAspectRatio="xMidYMid slice" aria-label="De tuin op het zuiden, bij avond, met het terras, de trampoline en de schommels">
  <defs>
    <linearGradient id="tnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18224a" />
      <stop offset=".6" stop-color="#4a4a7a" />
      <stop offset="1" stop-color="#c98a6a" />
    </linearGradient>
    <linearGradient id="tnLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e6a34" />
      <stop offset="1" stop-color="#244a20" />
    </linearGradient>
    <pattern id="tnTiles" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#8a8072" /><path d="M0 29 H60 M30 0 V29" stroke="#6a6256" stroke-width="2" />
    </pattern>
    <pattern id="tnBrick" width="40" height="16" patternUnits="userSpaceOnUse">
      <rect width="40" height="16" fill="#7a3a28" /><rect x="1" y="1" width="38" height="6.5" fill="#8a4430" /><rect x="-19" y="9" width="38" height="6.5" fill="#743626" /><rect x="21" y="9" width="38" height="6.5" fill="#80402c" />
    </pattern>
    <radialGradient id="tnGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".5" />
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tnVign" cx=".5" cy=".45" r=".8">
      <stop offset=".55" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#05040e" stop-opacity=".55" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#tnSky)" />
  <g fill="#fff"><circle class="tn-star" cx="200" cy="80" r="2" /><circle class="tn-star b" cx="420" cy="140" r="1.6" /><circle class="tn-star" cx="700" cy="60" r="1.8" /><circle class="tn-star c" cx="980" cy="120" r="1.6" /><circle class="tn-star b" cx="1260" cy="70" r="2" /><circle class="tn-star" cx="1480" cy="160" r="1.6" /></g>
  <circle id="tn-maan" cx="1300" cy="180" r="44" fill="#fff4d0" />
  <circle cx="1316" cy="170" r="9" fill="#efe2b8" opacity=".6" /><circle cx="1288" cy="196" r="6" fill="#efe2b8" opacity=".6" />
  <!-- de horizon met de lichtjes van de stad en de Martinitoren -->
  <path d="M0 470 H1600 V520 H0Z" fill="#2e3a3a" />
  <g fill="#2a3040"><rect x="1080" y="440" width="80" height="30" /><rect x="1114" y="384" width="12" height="86" /><path d="M1114 384 l6 -22 l6 22z" /><rect x="1170" y="452" width="60" height="18" /></g>
  <g fill="#ffd27a"><circle class="tn-city" cx="1092" cy="456" r="2" /><circle class="tn-city b" cx="1140" cy="452" r="2" /><circle cx="1120" cy="410" r="2.4" /><circle class="tn-city" cx="1190" cy="462" r="2" /></g>

  <!-- de grote fruitbomen met lampjes -->
  <g>
    <path d="M330 520 C320 440 290 380 300 300 M300 380 C260 340 230 330 200 300 M310 340 C350 300 380 290 420 260" stroke="#3a2a1e" stroke-width="18" fill="none" stroke-linecap="round" />
    <g fill="#26402a"><circle cx="250" cy="270" r="80" /><circle cx="350" cy="230" r="90" /><circle cx="430" cy="280" r="70" /><circle cx="300" cy="320" r="70" /></g>
    <path d="M1460 540 C1470 450 1500 390 1480 300 M1480 400 C1520 360 1550 350 1580 320" stroke="#3a2a1e" stroke-width="18" fill="none" stroke-linecap="round" />
    <g fill="#26402a"><circle cx="1480" cy="270" r="90" /><circle cx="1570" cy="300" r="80" /><circle cx="1400" cy="310" r="70" /></g>
    <g id="tn-lampjes" class="lamp lamp-bulb" fill="#ffe08a">
      <path d="M180 300 Q300 360 440 300 M1380 320 Q1480 370 1600 330" stroke="#1a1a1a" stroke-width="2" fill="none" />
      <circle class="tn-bulb" cx="210" cy="318" r="5" /><circle class="tn-bulb b" cx="250" cy="332" r="5" /><circle class="tn-bulb" cx="300" cy="338" r="5" /><circle class="tn-bulb b" cx="350" cy="334" r="5" /><circle class="tn-bulb" cx="400" cy="320" r="5" />
      <circle class="tn-bulb b" cx="1410" cy="338" r="5" /><circle class="tn-bulb" cx="1460" cy="350" r="5" /><circle class="tn-bulb b" cx="1510" cy="350" r="5" /><circle class="tn-bulb" cx="1560" cy="340" r="5" />
    </g>
  </g>

  <!-- het gazon -->
  <path d="M0 500 H1600 V900 H0Z" fill="url(#tnLawn)" />

  <!-- de schommels -->
  <g id="tn-schommel">
    <path d="M600 330 L560 600 M600 330 L640 600 M880 330 L840 600 M880 330 L920 600 M600 330 H880" stroke="#8a6440" stroke-width="12" stroke-linecap="round" />
    <g class="tn-swing"><path d="M660 334 V520 M710 334 V520" stroke="#c9b48a" stroke-width="3" /><rect x="650" y="516" width="70" height="12" rx="4" fill="#c4302b" /></g>
    <g class="tn-swing b"><path d="M770 334 V520 M820 334 V520" stroke="#c9b48a" stroke-width="3" /><rect x="760" y="516" width="70" height="12" rx="4" fill="#2f6fb1" /></g>
  </g>
  <!-- de trampoline -->
  <g id="tn-tramp">
    <ellipse cx="1150" cy="610" rx="170" ry="44" fill="#1a1a1e" stroke="#2f6fb1" stroke-width="12" />
    <path d="M1000 620 L1010 680 M1300 620 L1290 680 M1080 650 L1084 690 M1220 650 L1216 690" stroke="#9aa0a6" stroke-width="6" />
  </g>

  <!-- de sporen in het dauwnatte gras -->
  <g id="tn-sporen" fill="#b8e0a4" opacity=".9">
    <!-- 1: naar de schommels -->
    <g transform="translate(730 860)"><path d="M0 0 l4 -10 l4 10z M10 -2 l4 -10 l4 10z" /></g>
    <g transform="translate(724 800)"><path d="M0 0 l4 -10 l4 10z M10 -2 l4 -10 l4 10z" /></g>
    <g transform="translate(730 740)"><path d="M0 0 l4 -10 l4 10z M10 -2 l4 -10 l4 10z" /></g>
    <g transform="translate(724 680)"><path d="M0 0 l4 -10 l4 10z M10 -2 l4 -10 l4 10z" /></g>
    <!-- 2: naar de trampoline -->
    <g><circle cx="900" cy="840" r="5" /><circle cx="940" cy="800" r="5" /><circle cx="980" cy="760" r="5" /><circle cx="1020" cy="720" r="5" /><circle cx="1060" cy="680" r="5" /></g>
    <!-- 3: naar de bloemen -->
    <g><ellipse cx="640" cy="850" rx="5" ry="12" /><ellipse cx="660" cy="846" rx="5" ry="12" /><circle cx="650" cy="828" r="4" /><ellipse cx="610" cy="770" rx="5" ry="12" /><ellipse cx="630" cy="766" rx="5" ry="12" /><circle cx="620" cy="748" r="4" /></g>
    <!-- 4: naar de sloot -->
    <g><path d="M1380 840 l8 -14 l8 14 l-8 -4z" /><path d="M1420 790 l8 -14 l8 14 l-8 -4z" /><path d="M1460 740 l8 -14 l8 14 l-8 -4z" /></g>
    <g font-family="IBM Plex Mono, monospace" font-size="28" font-weight="600" fill="#f8f0e0" stroke="#1a2a14" stroke-width="5" paint-order="stroke">
      <text x="760" y="885">1</text><text x="880" y="880">2</text><text x="606" y="885">3</text><text x="1370" y="880">4</text>
    </g>
  </g>
  <!-- de koevoet in het gras bij de schommels -->
  <g id="tn-koevoet"><path d="M690 590 L820 610 q10 2 12 -8" stroke="#c4302b" stroke-width="7" fill="none" stroke-linecap="round" /></g>

  <!-- de bloemenborder bij het terras (zoals op de foto) -->
  <g id="tn-border">
    <path d="M0 640 Q120 600 220 660 V720 H0Z" fill="#2e4a26" />
    <g><circle cx="40" cy="630" r="8" fill="#c86aa8" /><circle cx="80" cy="620" r="7" fill="#e8a040" /><circle cx="120" cy="628" r="8" fill="#c86aa8" /><circle cx="160" cy="640" r="7" fill="#9a8ad0" /><circle cx="60" cy="650" r="6" fill="#f6efe2" /><circle cx="190" cy="656" r="7" fill="#e8a040" /></g>
  </g>
  <!-- het terras met de muur van de zaal en de glazen deur -->
  <g id="tn-terras">
    <path d="M0 720 H520 L600 900 H0Z" fill="url(#tnTiles)" />
    <rect x="0" y="380" width="120" height="340" fill="url(#tnBrick)" />
    <rect x="20" y="460" width="80" height="260" fill="#f2d48a" opacity=".9" stroke="#e9e2d2" stroke-width="6" />
    <circle cx="60" cy="560" r="80" fill="url(#tnGlow)" />
    <g><rect x="200" y="740" width="120" height="10" fill="#8a6440" /><path d="M210 750 v50 M310 750 v50" stroke="#8a6440" stroke-width="6" /><path d="M360 770 h40 v-60 h-10 v50 h-30z" fill="#3a3a52" /></g>
  </g>

  <!-- een haas die heen en weer huppelt -->
  <g id="tn-haas"><g class="ree-walk" style="--walk:-240px;--dir:-1;--walkt:16s"><g class="haas-hop"><g transform="translate(520 650)">
    <!-- @personage haas --><g transform="translate(0 0) scale(0.8 0.8)"><path d="M-30 -2 C-34 -14 -22 -18 -8 -14 L-4 -2Z" fill="#6a5034"/><path d="M-36 -26 C-40 -44 -10 -50 10 -40 C22 -34 24 -22 16 -14 C4 -6 -26 -6 -36 -26Z" fill="#9a7a56" stroke="#6a5034" stroke-width="1.4"/><circle cx="-38" cy="-30" r="6" fill="#f6efe4"/><path d="M12 -16 L18 -2 M6 -16 L8 -2" stroke="#6a5034" stroke-width="4" stroke-linecap="round"/><path d="M10 -38 C14 -50 30 -52 34 -42 C36 -34 28 -30 20 -32Z" fill="#9a7a56" stroke="#6a5034" stroke-width="1.4"/><path d="M14 -46 C8 -70 14 -78 20 -60Z M20 -46 C20 -72 28 -78 28 -58Z" fill="#9a7a56" stroke="#6a5034" stroke-width="1.4"/><path d="M10 -66 C10 -72 13 -76 15 -70 M21 -68 C22 -74 26 -76 27 -70" stroke="#1a1410" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="26" cy="-42" r="2.6" fill="#1a100a"/><circle cx="27" cy="-43" r=".8" fill="#fff"/><circle cx="34" cy="-38" r="1.6" fill="#3a2418"/></g><!-- @einde haas -->
  </g></g></g></g>

  <!-- een egel die over het gras scharrelt -->
  <g id="tn-egel"><g class="tn-egelwalk"><g transform="translate(860 860)">
    <ellipse cx="0" cy="-10" rx="22" ry="13" fill="#6a5440" />
    <path d="M-20 -14 l-4 -6 M-14 -20 l-2 -8 M-6 -22 l0 -8 M2 -22 l2 -8 M10 -20 l4 -7 M16 -16 l6 -5 M-10 -14 l-2 -6 M4 -16 l2 -6" stroke="#3a2e22" stroke-width="2.5" stroke-linecap="round" />
    <path d="M18 -8 q10 0 12 4 q-6 4 -12 2z" fill="#c9a882" /><circle cx="30" cy="-4" r="2" fill="#1a1a1a" /><circle cx="22" cy="-8" r="1.5" fill="#1a1a1a" />
    <path d="M-8 2 v3 M8 2 v3" stroke="#3a2e22" stroke-width="3" />
  </g></g></g>

  <!-- de ree, aan de rand van de tuin -->
  <g id="tn-ree" class="tn-ree"><g class="ree-walk walking" style="--walk:-220px;--dir:-1;--walkt:24s"><g transform="translate(1420 560)">
    <!-- @personage ree --><g transform="translate(0 0) scale(0.9 0.9)"><path class="rleg a" d="M-32 -50 L-36 -18 L-34 0" stroke="#7a4e30" stroke-width="5" fill="none" stroke-linecap="round"/><path class="rleg b" d="M-24 -48 L-22 -18 L-26 0" stroke="#7a4e30" stroke-width="5" fill="none" stroke-linecap="round"/><path class="rleg b" d="M24 -50 L26 -20 L24 0" stroke="#7a4e30" stroke-width="5" fill="none" stroke-linecap="round"/><path class="rleg a" d="M32 -50 L36 -20 L34 0" stroke="#7a4e30" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-42 -62 C-44 -76 -24 -82 0 -80 C22 -80 36 -74 40 -62 C42 -50 32 -44 0 -44 C-28 -44 -42 -48 -42 -62Z" fill="#a8714a" stroke="#7a4e30" stroke-width="1.4"/><path d="M-30 -50 C-10 -46 14 -46 30 -50" stroke="#e8d2b4" stroke-width="5" fill="none" opacity=".7"/><ellipse cx="-42" cy="-64" rx="7" ry="9" fill="#f6efe4"/><g id="tn-reehead"><g><path d="M30 -58 C34 -72 38 -84 46 -92 L58 -86 C52 -78 48 -66 44 -54Z" fill="#a8714a"/><path d="M44 -94 C50 -100 62 -100 70 -94 C76 -90 78 -84 74 -82 C66 -80 58 -82 52 -80 C46 -82 42 -88 44 -94Z" fill="#a8714a" stroke="#7a4e30" stroke-width="1.4"/><ellipse cx="75" cy="-84" rx="3" ry="2.4" fill="#2a1a10"/><circle cx="58" cy="-92" r="2.6" fill="#1a100a"/><circle cx="59" cy="-93" r=".8" fill="#fff"/><path d="M46 -96 C40 -110 44 -114 50 -106Z M52 -98 C52 -114 58 -114 58 -102Z" fill="#a8714a" stroke="#7a4e30" stroke-width="1.2"/><path d="M47 -104 C45 -108 46 -110 48 -106" stroke="#e8b8a0" stroke-width="2"/></g></g></g><!-- @einde ree -->
  </g></g></g>

  <rect width="1600" height="900" fill="url(#tnVign)" pointer-events="none" />

  <g class="hits">
    <rect class="hit" data-hs="naarbinnen" data-label="De glazen deur terug naar de zaal" x="14" y="454" width="92" height="266" fill="transparent" />
    <rect class="hit" data-hs="sporen" data-label="Sporen in het gras" x="200" y="620" width="1300" height="40" fill="transparent" />
    <rect class="hit" data-hs="sporen" data-label="Sporen in het gras" x="200" y="690" width="1300" height="200" fill="transparent" />
    <rect class="hit" data-hs="schommel" data-label="De schommels" x="560" y="320" width="370" height="280" fill="transparent" />
    <rect class="hit" id="hit-koevoet" data-hs="koevoet" data-label="Iets roods in het gras" x="680" y="580" width="160" height="40" fill="transparent" />
    <rect class="hit" data-hs="tramp" data-label="De trampoline" x="980" y="560" width="340" height="110" fill="transparent" />
    <rect class="hit" data-hs="tnree" data-label="De ree, die in het maanlicht door de tuin loopt" x="1160" y="486" width="350" height="84" fill="transparent" />
    <rect class="hit" data-hs="terras" data-label="Het terras op het zuiden" x="150" y="726" width="300" height="100" fill="transparent" />
    <rect class="hit" data-hs="sterren" data-label="De sterren" x="150" y="40" width="900" height="120" fill="transparent" />
    <rect class="hit" data-hs="haas" data-label="Een haas die door de tuin huppelt" x="250" y="600" width="300" height="60" fill="transparent" />
    <rect class="hit" data-hs="egel" data-label="Een egel in het gras" x="760" y="820" width="260" height="60" fill="transparent" />
    <rect class="hit" data-hs="maan" data-label="De maan" x="1250" y="130" width="100" height="100" fill="transparent" />
    <rect class="hit" data-hs="stad2" data-label="De lichtjes van Groningen en de Martinitoren" x="1060" y="360" width="180" height="110" fill="transparent" />
    <rect class="hit" data-hs="border" data-label="De bloemenborder" x="0" y="600" width="220" height="80" fill="transparent" />
    <rect class="hit" data-hs="bomen" data-label="Fruitbomen met lampjes" x="170" y="180" width="300" height="200" fill="transparent" />
  </g>
</svg>
