    <rect x="20" y="460" width="80" height="260" fill="#f2d48a" opacity=".9" stroke="#e9e2d2" stroke-width="6" />
    <circle cx="60" cy="560" r="80" fill="url(#tnGlow)" />
    <g id="tn-terras-tafel">
      <path class="tn-table-leg" d="M188 734 L185 812" stroke="#785638" stroke-width="6" stroke-linecap="round" />
      <path class="tn-table-leg" d="M269 734 L273 812" stroke="#785638" stroke-width="6" stroke-linecap="round" />
      <path class="tn-table-leg" d="M213 747 L210 822" stroke="#785638" stroke-width="6" stroke-linecap="round" />
      <path class="tn-table-leg" d="M296 747 L300 822" stroke="#785638" stroke-width="6" stroke-linecap="round" />
      <path d="M208 788 H295 M210 776 H291" stroke="#9b7652" stroke-width="4" />
      <path d="M184 730 L270 730 L298 743 L212 743Z" fill="#c49a68" stroke="#68492e" stroke-width="2.5" />
      <path d="M212 743 H298 V753 H212Z" fill="#8f6947" stroke="#68492e" stroke-width="2" />
      <path d="M184 730 L212 743 V753 L184 740Z" fill="#a77c51" stroke="#68492e" stroke-width="2" />
      <path d="M270 730 L298 743 V753 L273 741Z" fill="#9a714c" stroke="#68492e" stroke-width="2" />
      <path d="M194 735 L267 735 M215 748 H292" stroke="#d7b58b" stroke-width="1.5" opacity=".8" />
      <path d="M224 730 Q226 720 238 720 H252 Q262 720 263 730Z" fill="#b45b43" stroke="#6e392d" stroke-width="2" />
      <path d="M231 720 Q226 709 219 706 M239 720 Q238 708 244 701 M248 720 Q256 712 261 709" stroke="#47713a" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <circle cx="219" cy="704" r="3.5" fill="#e26855" /><circle cx="244" cy="699" r="3.5" fill="#f0c84b" /><circle cx="262" cy="707" r="3.5" fill="#8574b7" />
    </g>
    <g id="tn-terras-stoel">
      <path class="tn-chair-leg" d="M356 708 L354 820" stroke="#263e56" stroke-width="5" stroke-linecap="round" />
      <path class="tn-chair-leg" d="M405 708 L408 820" stroke="#263e56" stroke-width="5" stroke-linecap="round" />
      <path class="tn-chair-leg" d="M360 767 L357 824" stroke="#263e56" stroke-width="5" stroke-linecap="round" />
      <path class="tn-chair-leg" d="M401 767 L404 824" stroke="#263e56" stroke-width="5" stroke-linecap="round" />
      <path d="M356 708 H405 V758 H356Z" fill="#263e56" stroke="#172b3d" stroke-width="3" />
      <path d="M362 716 H399 M361 728 H400 M360 740 H401" stroke="#7890a0" stroke-width="3" stroke-linecap="round" />
      <path d="M358 758 H403 L398 776 H362Z" fill="#355672" stroke="#172b3d" stroke-width="3" />
      <path d="M363 763 H398 M354 800 H408 M357 784 H405" stroke="#4d6c82" stroke-width="3" />
    </g>
  </g>

  <!-- een haas die heen en weer huppelt -->
  <g id="tn-haas"><g class="ree-walk" style="--walk:-240px;--dir:-1;--walkt:16s"><g class="haas-hop"><g transform="translate(500 690)">
    <!-- @personage haas --><g transform="translate(0 0) scale(0.8 0.8)"><path d="M-30 -2 C-34 -14 -22 -18 -8 -14 L-4 -2Z" fill="#6a5034"/><path d="M-36 -26 C-40 -44 -10 -50 10 -40 C22 -34 24 -22 16 -14 C4 -6 -26 -6 -36 -26Z" fill="#9a7a56" stroke="#6a5034" stroke-width="1.4"/><circle cx="-38" cy="-30" r="6" fill="#f6efe4"/><path d="M12 -16 L18 -2 M6 -16 L8 -2" stroke="#6a5034" stroke-width="4" stroke-linecap="round"/><path d="M10 -38 C14 -50 30 -52 34 -42 C36 -34 28 -30 20 -32Z" fill="#9a7a56" stroke="#6a5034" stroke-width="1.4"/><path d="M14 -46 C8 -70 14 -78 20 -60Z M20 -46 C20 -72 28 -78 28 -58Z" fill="#9a7a56" stroke="#6a5034" stroke-width="1.4"/><path d="M10 -66 C10 -72 13 -76 15 -70 M21 -68 C22 -74 26 -76 27 -70" stroke="#1a1410" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="26" cy="-42" r="2.6" fill="#1a100a"/><circle cx="27" cy="-43" r=".8" fill="#fff"/><circle cx="34" cy="-38" r="1.6" fill="#3a2418"/></g><!-- @einde haas -->
  </g></g></g></g>

  <!-- een egel die over het gras scharrelt -->
  <g id="tn-egel"><g class="tn-egelwalk"><g transform="translate(860 860)">
    <ellipse cx="0" cy="-10" rx="22" ry="13" fill="#6a5440" />
    <path d="M-20 -14 l-4 -6 M-14 -20 l-2 -8 M-6 -22 l0 -8 M2 -22 l2 -8 M10 -20 l4 -7 M16 -16 l6 -5 M-10 -14 l-2 -6 M4 -16 l2 -6" stroke="#3a2e22" stroke-width="2.5" stroke-linecap="round" />
    <path d="M18 -8 q10 0 12 4 q-6 4 -12 2z" fill="#c9a882" /><circle cx="30" cy="-4" r="2" fill="#1a1a1a" /><circle cx="22" cy="-8" r="1.5" fill="#1a1a1a" />
    <path d="M-8 2 v3 M8 2 v3" stroke="#3a2e22" stroke-width="3" />
  </g></g></g>

  <!-- de ree, aan de rand van de tuin -->
  <g id="tn-ree" class="tn-ree"><g class="ree-walk walking" style="--walk:-220px;--dir:-1;--walkt:24s"><g transform="translate(1420 560)">
    <!-- @personage ree --><g transform="translate(0 0) scale(0.9 0.9)"><path class="rleg a" d="M-32 -50 L-36 -18 L-34 0" stroke="#7a4e30" stroke-width="5" fill="none" stroke-linecap="round"/><path class="rleg b" d="M-24 -48 L-22 -18 L-26 0" stroke="#7a4e30" stroke-width="5" fill="none" stroke-linecap="round"/><path class="rleg b" d="M24 -50 L26 -20 L24 0" stroke="#7a4e30" stroke-width="5" fill="none" stroke-linecap="round"/><path class="rleg a" d="M32 -50 L36 -20 L34 0" stroke="#7a4e30" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M-42 -62 C-44 -76 -24 -82 0 -80 C22 -80 36 -74 40 -62 C42 -50 32 -44 0 -44 C-28 -44 -42 -48 -42 -62Z" fill="#a8714a" stroke="#7a4e30" stroke-width="1.4"/><path d="M-30 -50 C-10 -46 14 -46 30 -50" stroke="#e8d2b4" stroke-width="5" fill="none" opacity=".7"/><ellipse cx="-42" cy="-64" rx="7" ry="9" fill="#f6efe4"/><g id="tn-reehead"><g><path d="M30 -58 C34 -72 38 -84 46 -92 L58 -86 C52 -78 48 -66 44 -54Z" fill="#a8714a"/><path d="M44 -94 C50 -100 62 -100 70 -94 C76 -90 78 -84 74 -82 C66 -80 58 -82 52 -80 C46 -82 42 -88 44 -94Z" fill="#a8714a" stroke="#7a4e30" stroke-width="1.4"/><ellipse cx="75" cy="-84" rx="3" ry="2.4" fill="#2a1a10"/><circle cx="58" cy="-92" r="2.6" fill="#1a100a"/><circle cx="59" cy="-93" r=".8" fill="#fff"/><path d="M46 -96 C40 -110 44 -114 50 -106Z M52 -98 C52 -114 58 -114 58 -102Z" fill="#a8714a" stroke="#7a4e30" stroke-width="1.2"/><path d="M47 -104 C45 -108 46 -110 48 -106" stroke="#e8b8a0" stroke-width="2"/></g></g></g><!-- @einde ree -->
  </g></g></g>

  <rect width="1600" height="900" fill="url(#tnVign)" pointer-events="none" />

