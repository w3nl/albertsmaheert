<svg xmlns="http://www.w3.org/2000/svg" class="scene" id="sc-tuin" viewBox="0 0 1600 900"
  preserveAspectRatio="xMidYMid slice" aria-label="De tuin op het zuiden, bij avond, met het terras, de trampoline en de schommels">
  <defs>
    <linearGradient id="tnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18224a" />
      <stop offset=".6" stop-color="#4a4a7a" />
      <stop offset="1" stop-color="#c98a6a" />
    </linearGradient>
    <linearGradient id="tnLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e6a34" />
      <stop offset="1" stop-color="#244a20" />
    </linearGradient>
    <pattern id="tnTiles" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#8a8072" /><path d="M0 29 H60 M30 0 V29" stroke="#6a6256" stroke-width="2" />
    </pattern>
    <pattern id="tnBrick" width="40" height="16" patternUnits="userSpaceOnUse">
      <rect width="40" height="16" fill="#7a3a28" /><rect x="1" y="1" width="38" height="6.5" fill="#8a4430" /><rect x="-19" y="9" width="38" height="6.5" fill="#743626" /><rect x="21" y="9" width="38" height="6.5" fill="#80402c" />
    </pattern>
    <radialGradient id="tnGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".5" />
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tnVign" cx=".5" cy=".45" r=".8">
      <stop offset=".55" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#05040e" stop-opacity=".55" />
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#tnSky)" />
  <g fill="#fff"><circle class="tn-star" cx="200" cy="80" r="2" /><circle class="tn-star b" cx="420" cy="140" r="1.6" /><circle class="tn-star" cx="700" cy="60" r="1.8" /><circle class="tn-star c" cx="980" cy="120" r="1.6" /><circle class="tn-star b" cx="1260" cy="70" r="2" /><circle class="tn-star" cx="1480" cy="160" r="1.6" /></g>
  <circle id="tn-maan" cx="1300" cy="180" r="44" fill="#fff4d0" />
  <circle cx="1316" cy="170" r="9" fill="#efe2b8" opacity=".6" /><circle cx="1288" cy="196" r="6" fill="#efe2b8" opacity=".6" />
  <!-- de horizon met de lichtjes van de stad en de Martinitoren -->
  <path d="M0 470 H1600 V520 H0Z" fill="#2e3a3a" />
  <g fill="#2a3040"><rect x="1080" y="440" width="80" height="30" /><rect x="1114" y="384" width="12" height="86" /><path d="M1114 384 l6 -22 l6 22z" /><rect x="1170" y="452" width="60" height="18" /></g>
  <g fill="#ffd27a"><circle class="tn-city" cx="1092" cy="456" r="2" /><circle class="tn-city b" cx="1140" cy="452" r="2" /><circle cx="1120" cy="410" r="2.4" /><circle class="tn-city" cx="1190" cy="462" r="2" /></g>

  <!-- de grote fruitbomen met lampjes -->
  <g>
    <path d="M330 520 C320 440 290 380 300 300 M300 380 C260 340 230 330 200 300 M310 340 C350 300 380 290 420 260" stroke="#3a2a1e" stroke-width="18" fill="none" stroke-linecap="round" />
    <g fill="#26402a"><circle cx="250" cy="270" r="80" /><circle cx="350" cy="230" r="90" /><circle cx="430" cy="280" r="70" /><circle cx="300" cy="320" r="70" /></g>
    <path d="M1460 540 C1470 450 1500 390 1480 300 M1480 400 C1520 360 1550 350 1580 320" stroke="#3a2a1e" stroke-width="18" fill="none" stroke-linecap="round" />
    <g fill="#26402a"><circle cx="1480" cy="270" r="90" /><circle cx="1570" cy="300" r="80" /><circle cx="1400" cy="310" r="70" /></g>
    <g id="tn-lampjes" class="lamp lamp-bulb" fill="#ffe08a">
      <path d="M180 300 Q300 360 440 300 M1380 320 Q1480 370 1600 330" stroke="#1a1a1a" stroke-width="2" fill="none" />
      <circle class="tn-bulb" cx="210" cy="318" r="5" /><circle class="tn-bulb b" cx="250" cy="332" r="5" /><circle class="tn-bulb" cx="300" cy="338" r="5" /><circle class="tn-bulb b" cx="350" cy="334" r="5" /><circle class="tn-bulb" cx="400" cy="320" r="5" />
      <circle class="tn-bulb b" cx="1410" cy="338" r="5" /><circle class="tn-bulb" cx="1460" cy="350" r="5" /><circle class="tn-bulb b" cx="1510" cy="350" r="5" /><circle class="tn-bulb" cx="1560" cy="340" r="5" />
    </g>
  </g>

  <!-- het gazon -->
  <path d="M0 500 H1600 V900 H0Z" fill="url(#tnLawn)" />
  <g id="tn-haag" aria-label="Lage groene haag langs de achterrand van de tuin">
    <path d="M420 516 Q430 492 452 492 Q464 466 490 481 Q509 461 532 483 Q552 470 572 490 Q600 464 626 484 Q650 460 675 484 Q700 468 722 490 Q752 466 780 486 Q805 464 832 486 Q856 468 880 490 Q910 464 936 484 Q962 460 989 484 Q1013 466 1038 488 Q1062 468 1084 492 Q1110 472 1138 490 L1150 522 H420Z" fill="#29492c" stroke="#1c3522" stroke-width="3" />
    <path d="M438 501 Q462 484 483 498 M518 498 Q543 481 565 499 M613 498 Q638 480 660 496 M704 501 Q731 481 755 498 M802 498 Q825 481 849 499 M895 500 Q920 480 946 497 M982 499 Q1005 482 1028 500 M1060 502 Q1082 486 1110 500" fill="none" stroke="#527443" stroke-width="4" stroke-linecap="round" opacity=".8" />
  </g>

  <!-- de schommels -->
  <g id="tn-schommel">
    <path d="M600 330 L560 600 M600 330 L640 600 M880 330 L840 600 M880 330 L920 600 M600 330 H880" stroke="#8a6440" stroke-width="12" stroke-linecap="round" />
    <g class="tn-swing"><path d="M660 334 V520 M710 334 V520" stroke="#c9b48a" stroke-width="3" /><rect x="650" y="516" width="70" height="12" rx="4" fill="#c4302b" /></g>
    <g class="tn-swing b"><path d="M770 334 V520 M820 334 V520" stroke="#c9b48a" stroke-width="3" /><rect x="760" y="516" width="70" height="12" rx="4" fill="#2f6fb1" /></g>
  </g>
  <!-- de trampoline -->
  <g id="tn-tramp">
    <ellipse cx="1150" cy="610" rx="170" ry="44" fill="#1a1a1e" stroke="#2f6fb1" stroke-width="12" />
    <path d="M1000 620 L1010 680 M1300 620 L1290 680 M1080 650 L1084 690 M1220 650 L1216 690" stroke="#9aa0a6" stroke-width="6" />
  </g>

  <!-- de sporen in het dauwnatte gras -->
  <g id="tn-sporen" fill="#b8e0a4" opacity=".9">
    <!-- 1: naar de schommels -->
    <g transform="translate(730 860)"><path d="M0 0 l4 -10 l4 10z M10 -2 l4 -10 l4 10z" /></g>
    <g transform="translate(724 800)"><path d="M0 0 l4 -10 l4 10z M10 -2 l4 -10 l4 10z" /></g>
    <g transform="translate(730 740)"><path d="M0 0 l4 -10 l4 10z M10 -2 l4 -10 l4 10z" /></g>
    <g transform="translate(724 680)"><path d="M0 0 l4 -10 l4 10z M10 -2 l4 -10 l4 10z" /></g>
    <!-- 2: naar de trampoline -->
    <g><circle cx="900" cy="840" r="5" /><circle cx="940" cy="800" r="5" /><circle cx="980" cy="760" r="5" /><circle cx="1020" cy="720" r="5" /><circle cx="1060" cy="680" r="5" /></g>
    <!-- 3: naar de bloemen -->
    <g><ellipse cx="640" cy="850" rx="5" ry="12" /><ellipse cx="660" cy="846" rx="5" ry="12" /><circle cx="650" cy="828" r="4" /><ellipse cx="610" cy="770" rx="5" ry="12" /><ellipse cx="630" cy="766" rx="5" ry="12" /><circle cx="620" cy="748" r="4" /></g>
    <!-- 4: naar de sloot -->
    <g><path d="M1380 840 l8 -14 l8 14 l-8 -4z" /><path d="M1420 790 l8 -14 l8 14 l-8 -4z" /><path d="M1460 740 l8 -14 l8 14 l-8 -4z" /></g>
    <g font-family="IBM Plex Mono, monospace" font-size="28" font-weight="600" fill="#f8f0e0" stroke="#1a2a14" stroke-width="5" paint-order="stroke">
      <text x="760" y="885">1</text><text x="880" y="880">2</text><text x="606" y="885">3</text><text x="1370" y="880">4</text>
    </g>
  </g>
  <!-- de koevoet in het gras bij de schommels -->
  <g id="tn-koevoet"><path d="M690 590 L820 610 q10 2 12 -8" stroke="#c4302b" stroke-width="7" fill="none" stroke-linecap="round" /></g>

  <!-- de bloemenborder bij het terras (zoals op de foto) -->
  <g id="tn-border">
    <path d="M0 640 Q120 600 220 660 V720 H0Z" fill="#2e4a26" />
    <g><circle cx="40" cy="630" r="8" fill="#c86aa8" /><circle cx="80" cy="620" r="7" fill="#e8a040" /><circle cx="120" cy="628" r="8" fill="#c86aa8" /><circle cx="160" cy="640" r="7" fill="#9a8ad0" /><circle cx="60" cy="650" r="6" fill="#f6efe2" /><circle cx="190" cy="656" r="7" fill="#e8a040" /></g>
  </g>
  <g id="tn-wildflowers" aria-label="Wilde bloemen langs de terrasrand">
    <path d="M212 712 Q300 690 520 712" fill="none" stroke="#74694f" stroke-width="8" />
    <g fill="none" stroke="#47713a" stroke-width="3" stroke-linecap="round">
      <path d="M246 708 Q242 678 250 652 M280 706 Q286 680 278 665 M322 709 Q318 680 330 646 M365 708 Q372 680 366 662 M410 710 Q404 676 418 650 M460 710 Q468 682 462 666 M500 712 Q494 686 508 658" />
      <path d="M248 683 l-12 -7 M282 690 l12 -8 M326 680 l-13 -8 M368 687 l13 -9 M413 681 l-13 -9 M465 692 l13 -8 M505 686 l-12 -8" />
    </g>
    <g fill="#f0c84b"><circle cx="250" cy="650" r="6" /><circle cx="250" cy="650" r="2" fill="#704f24" /><circle cx="330" cy="644" r="7" /><circle cx="330" cy="644" r="2" fill="#704f24" /></g>
    <g fill="#8574b7"><circle cx="278" cy="662" r="4" /><circle cx="270" cy="658" r="3" /><circle cx="286" cy="657" r="3" /><circle cx="366" cy="659" r="4" /><circle cx="358" cy="655" r="3" /><circle cx="374" cy="654" r="3" /></g>
    <g fill="#e26855"><circle cx="418" cy="648" r="6" /><circle cx="418" cy="648" r="2" fill="#f6e8c8" /></g>
    <g fill="#7e9fdb"><circle cx="462" cy="663" r="4" /><circle cx="454" cy="659" r="3" /><circle cx="470" cy="658" r="3" /><circle cx="508" cy="655" r="4" /><circle cx="500" cy="651" r="3" /><circle cx="516" cy="650" r="3" /></g>
  </g>
