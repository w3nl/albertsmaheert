<svg xmlns="http://www.w3.org/2000/svg" class="scene" id="sc-zolder" viewBox="0 0 1600 900"
  preserveAspectRatio="xMidYMid slice" aria-label="De hooizolder: de overloop met de oude gebinten en de deuren van Thedema, Alma en Folkerda">
  <defs>
    <linearGradient id="zlWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ede0" />
      <stop offset="1" stop-color="#ddd3c0" />
    </linearGradient>
    <linearGradient id="zlRoof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9cfbc" />
      <stop offset="1" stop-color="#efe8da" />
    </linearGradient>
    <linearGradient id="zlOak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a48" />
      <stop offset=".5" stop-color="#a8865e" />
      <stop offset="1" stop-color="#6e5034" />
    </linearGradient>
    <linearGradient id="zlOakH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8865e" />
      <stop offset="1" stop-color="#6e5034" />
    </linearGradient>
    <linearGradient id="zlFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a878" />
      <stop offset="1" stop-color="#9a7a50" />
    </linearGradient>
    <linearGradient id="zlSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbde6" />
      <stop offset="1" stop-color="#dcebf2" />
    </linearGradient>
    <linearGradient id="zlDoor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4efe4" />
      <stop offset="1" stop-color="#d9d0bc" />
    </linearGradient>
    <radialGradient id="zlSun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d0" stop-opacity=".6" />
      <stop offset="1" stop-color="#fff6d0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="zlVign" cx=".5" cy=".45" r=".78">
      <stop offset=".6" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#2a1a08" stop-opacity=".5" />
    </radialGradient>
    <pattern id="zlGrain" width="12" height="80" patternUnits="userSpaceOnUse">
      <path d="M3 0 q2 40 0 80 M8 0 q-2 40 0 80" stroke="#5a3e26" stroke-width="1" opacity=".35" fill="none" />
    </pattern>
  </defs>

  <!-- de achterwand en het schuine dak aan weerszijden -->
  <rect width="1600" height="900" fill="url(#zlWall)" />
  <path d="M0 0 L0 640 L160 640 L420 0Z" fill="url(#zlRoof)" />
  <path d="M1600 0 L1600 640 L1480 640 L1220 0Z" fill="url(#zlRoof)" />
  <path d="M160 640 L420 0 M1480 640 L1220 0" stroke="#bfb29a" stroke-width="3" />
  <!-- sporen (de balken van het dak) -->
  <g stroke="url(#zlOakH)" stroke-width="16" opacity=".75">
    <path d="M40 640 L300 0 M100 640 L360 0" /><path d="M1560 640 L1300 0 M1500 640 L1240 0" />
  </g>

  <!-- de vloer -->
  <path d="M0 640 H1600 V900 H0Z" fill="url(#zlFloor)" />
  <g stroke="#8a6a44" stroke-width="2" opacity=".6">
    <path d="M0 690 H1600 M0 750 H1600 M0 820 H1600" />
    <path d="M800 640 L800 900 M560 640 L420 900 M1040 640 L1180 900 M320 640 L60 900 M1280 640 L1540 900" />
  </g>

  <!-- de trap naar beneden, met een leuning -->
  <g id="zl-trap">
    <path d="M0 700 L230 700 L180 900 L0 900Z" fill="#6e5034" />
    <g stroke="#a8865e" stroke-width="10"><path d="M10 730 H222 M10 770 H212 M10 812 H202 M10 856 H192" /></g>
    <path d="M220 560 L170 900 M20 560 V900" stroke="#5a3e26" stroke-width="12" />
    <path d="M20 560 H220" stroke="#8a6a48" stroke-width="16" stroke-linecap="round" />
    <g stroke="#7a5a3a" stroke-width="6"><path d="M60 560 V700 M100 560 V700 M140 560 V700 M180 560 V700" /></g>
  </g>

  <!-- de deuren van de drie kamers -->
  <g id="zl-doors">
    <g>
      <rect x="280" y="330" width="140" height="310" fill="#cbbfa6" />
      <rect x="290" y="340" width="120" height="300" fill="url(#zlDoor)" stroke="#a89a80" stroke-width="2" />
      <circle cx="396" cy="500" r="5" fill="#8a8a8a" />
      <rect x="310" y="372" width="80" height="26" rx="4" fill="#5e4632" /><text x="350" y="391" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" font-weight="600" fill="#f8f0e0">Thedema</text>
    </g>
    <g>
      <rect x="600" y="330" width="140" height="310" fill="#cbbfa6" />
      <rect x="610" y="340" width="120" height="300" fill="url(#zlDoor)" stroke="#a89a80" stroke-width="2" />
      <circle cx="716" cy="500" r="5" fill="#8a8a8a" />
      <rect x="630" y="372" width="80" height="26" rx="4" fill="#5e4632" /><text x="670" y="391" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" font-weight="600" fill="#f8f0e0">Alma</text>
    </g>
    <g>
      <rect x="980" y="330" width="140" height="310" fill="#cbbfa6" />
      <rect x="990" y="340" width="120" height="300" fill="url(#zlDoor)" stroke="#a89a80" stroke-width="2" />
      <circle cx="1096" cy="500" r="5" fill="#8a8a8a" />
      <rect x="1010" y="372" width="80" height="26" rx="4" fill="#5e4632" /><text x="1050" y="391" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="15" font-weight="600" fill="#f8f0e0">Folkerda</text>
    </g>
  </g>

  <!-- het oude hooiluik in de achtergevel, met de katrol aan de hijsbalk -->
  <g id="zl-luik">
    <rect x="1230" y="250" width="200" height="270" fill="url(#zlSky)" />
    <circle cx="1400" cy="290" r="60" fill="url(#zlSun)" />
    <g class="zl-cloud" fill="#fff" opacity=".9"><ellipse cx="1290" cy="300" rx="40" ry="10" /><ellipse cx="1310" cy="292" rx="22" ry="10" /></g>
    <path d="M1230 470 Q1300 440 1360 462 T1430 450 V520 H1230Z" fill="#5e8a46" />
    <path d="M1230 486 H1430" stroke="#8fb45a" stroke-width="4" opacity=".7" />
    <circle cx="1386" cy="452" r="22" fill="#4f7a3a" /><rect x="1383" y="460" width="6" height="22" fill="#5a4030" />
    <rect x="1222" y="242" width="216" height="286" fill="none" stroke="#6e5034" stroke-width="16" />
    <!-- de open luikdeuren -->
    <path d="M1222 250 L1180 270 L1180 520 L1222 528Z" fill="#7a5a3a" stroke="#4a321e" stroke-width="3" />
    <path d="M1438 250 L1470 262 L1470 518 L1438 528Z" fill="#7a5a3a" stroke="#4a321e" stroke-width="3" />
    <!-- de hijsbalk met de katrol -->
    <rect x="1260" y="200" width="200" height="26" fill="url(#zlOakH)" stroke="#4a321e" stroke-width="2" />
    <g id="zl-katrol">
      <circle cx="1400" cy="246" r="20" fill="#5a5f66" stroke="#2a2e33" stroke-width="4" />
      <circle cx="1400" cy="246" r="5" fill="#2a2e33" />
      <path d="M1400 226 v-6" stroke="#2a2e33" stroke-width="5" />
    </g>
    <path id="zl-rope" d="M1380 246 V520 M1420 246 V420" stroke="#b8925a" stroke-width="4" />
    <g id="zl-hook"><path d="M1420 420 v14 a8 8 0 1 1 -10 6" stroke="#5a5f66" stroke-width="4" fill="none" /></g>
  </g>
  <!-- een koelkastje met folders, en een quilt aan de muur (zoals op de echte overloop) -->
  <g id="zl-koelkast">
    <rect x="752" y="300" width="92" height="120" fill="#f4e6d0" stroke="#c9b48a" stroke-width="3" />
    <g fill="#c4302b" opacity=".7"><rect x="762" y="310" width="20" height="20" /><rect x="802" y="310" width="20" height="20" /><rect x="782" y="340" width="20" height="20" /><rect x="822" y="340" width="16" height="20" /><rect x="762" y="370" width="20" height="20" /><rect x="802" y="370" width="20" height="20" /></g>
    <g fill="#6a8a4a" opacity=".7"><circle cx="830" cy="320" r="7" /><circle cx="772" cy="350" r="7" /><circle cx="830" cy="380" r="7" /></g>
    <rect x="756" y="540" width="84" height="100" rx="4" fill="#f6f6f2" stroke="#c9c5bb" stroke-width="2" />
    <path d="M756 572 h84" stroke="#c9c5bb" stroke-width="2" /><rect x="828" y="548" width="4" height="16" rx="2" fill="#9aa0a6" />
    <rect x="762" y="522" width="70" height="18" fill="#e9e2d2" stroke="#bdb6a6" />
    <g><rect x="766" y="500" width="14" height="24" fill="#2f6fb1" /><rect x="782" y="504" width="14" height="20" fill="#6a8a4a" /><rect x="798" y="498" width="14" height="26" fill="#e8a040" /><rect x="814" y="502" width="14" height="22" fill="#c4302b" /></g>
  </g>

  <!-- Roelofs gereedschapskist (verschijnt als hij boven is) -->
  <g id="zl-kist">
    <rect x="1190" y="590" width="150" height="70" rx="6" fill="#c4302b" stroke="#7a1a16" stroke-width="3" />
    <path d="M1190 610 h150" stroke="#7a1a16" stroke-width="3" />
    <path d="M1240 590 v-14 h50 v14" stroke="#2a2a2a" stroke-width="6" fill="none" />
    <rect x="1258" y="604" width="14" height="10" fill="#d6a640" />
  </g>

  <!-- de gebinten: twee zware eiken stijlen, een ankerbalk en korbelen (schoren) -->
  <g id="zl-gebint">
    <rect x="470" y="0" width="56" height="640" fill="url(#zlOak)" />
    <rect x="470" y="0" width="56" height="640" fill="url(#zlGrain)" />
    <rect x="860" y="0" width="56" height="640" fill="url(#zlOak)" />
    <rect x="860" y="0" width="56" height="640" fill="url(#zlGrain)" />
    <rect x="0" y="150" width="1600" height="48" fill="url(#zlOakH)" />
    <path d="M0 150 H1600" stroke="#4a321e" stroke-width="2" />
    <path d="M526 300 L700 198 M470 300 L300 198 M916 300 L1090 198 M860 300 L690 198" stroke="url(#zlOakH)" stroke-width="30" />
    <path d="M526 300 L700 198 M470 300 L300 198 M916 300 L1090 198 M860 300 L690 198" stroke="#4a321e" stroke-width="2" opacity=".5" />
    <!-- houten pennen en telmerken in het hout -->
    <g fill="#4a321e"><circle cx="498" cy="290" r="5" /><circle cx="888" cy="290" r="5" /><circle cx="498" cy="174" r="5" /><circle cx="888" cy="174" r="5" /></g>
    <g stroke="#3a2614" stroke-width="2.5" opacity=".8"><path d="M486 320 v18 M492 320 v18 M498 320 v18 M876 320 l6 18 l6 -18 M894 320 v18" /></g>
    <!-- de oude kast in de stijl -->
    <g id="zl-kast">
      <rect x="868" y="404" width="40" height="112" rx="2" fill="#5e4128" stroke="#3a2614" stroke-width="3" />
      <g fill="#d9c39a" stroke="#6a4a2a" stroke-width="1.5"><circle cx="888" cy="430" r="8" /><circle cx="888" cy="460" r="8" /><circle cx="888" cy="490" r="8" /></g>
      <g stroke="#6a4a2a" stroke-width="1.5"><path d="M888 424 v6 M888 454 v6 M888 484 v6" /></g>
    </g>
    <g id="zl-kastopen">
      <rect x="868" y="404" width="40" height="112" rx="2" fill="#1a120a" />
      <path d="M868 404 L846 412 V512 L868 516Z" fill="#5e4128" stroke="#3a2614" stroke-width="2" />
    </g>
  </g>
  <!-- een oude hooivork aan de muur, en een zwaluwnest onder de balk -->
  <g id="zl-vork">
    <path d="M1150 220 L1150 560" stroke="#8a6a48" stroke-width="8" stroke-linecap="round" />
    <path d="M1132 560 v40 M1150 560 v44 M1168 560 v40 M1132 560 h36" stroke="#6f767e" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>
  <g id="zl-nest"><path d="M560 198 q30 26 60 0z" fill="#8a7a5a" stroke="#5a4a3a" stroke-width="2" /><g class="zl-chicks" fill="#3a3030"><circle cx="578" cy="198" r="5" /><circle cx="596" cy="196" r="5" /></g></g>
  <!-- een baal stro als bankje -->
  <g id="zl-baal">
    <rect x="560" y="690" width="140" height="64" rx="6" fill="#d9b860" stroke="#a8862e" stroke-width="3" />
    <g stroke="#b89a40" stroke-width="2"><path d="M570 702 h120 M570 716 h120 M570 730 h120 M570 742 h120" /></g>
    <path d="M590 690 v64 M670 690 v64" stroke="#8a6a28" stroke-width="3" />
  </g>

  <!-- het hobbelpaardje (de gratis hint), op de baal -->
  <g id="zl-paardje" transform="translate(630 690) scale(.3)" fill="#d9ad6e" stroke="#7a4a20" stroke-width="6">
    <path d="M-56 -6 Q0 16 56 -6" fill="none" stroke-width="9" />
    <path d="M-30 -44 L-38 0 M-16 -44 L-20 4 M16 -44 L20 4 M30 -44 L38 0" stroke-width="9" />
    <path d="M-40 -60 C-40 -74 30 -76 34 -60 C36 -48 28 -40 0 -40 C-30 -40 -40 -46 -40 -60Z" />
    <path d="M24 -64 C30 -86 38 -100 50 -104 C62 -106 70 -98 68 -90 C66 -84 58 -84 52 -84 C48 -76 44 -66 38 -58Z" />
    <circle cx="56" cy="-96" r="3" fill="#2a1a0c" stroke="none" /><path d="M-10 -66 h22 v6 h-22z" fill="#c4302b" stroke="none" />
  </g>

  <!-- Roelof (binnen, als zijn kist boven is) -->
  <g id="zl-roelof"><g transform="translate(1528 790)">
    <!-- @personage roelof --><g class="idle" style="animation-delay:-0.4s"><g transform="translate(0 0) scale(1.25 1.25)"><defs><linearGradient id="zlRKiel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3e8a74"/><stop offset="1" stop-color="#1a443a"/></linearGradient></defs><path d="M-18 -76 L-17 -4 L-5 -4 L-6 -76Z M18 -76 L17 -4 L5 -4 L6 -76Z" fill="#2e6a5a" stroke="#00000030" stroke-width="1"/><path d="M-21 -1 C-21 -9 -6 -10 -4 -6 L-4 0 Z M21 -1 C21 -9 6 -10 4 -6 L4 0 Z" fill="#2a2420"/><path d="M-24 0 C-26 -10 -8 -12 -3 -6 L-3 0Z M24 0 C26 -10 8 -12 3 -6 L3 0Z" fill="#2a2420"/><path d="M-32 -66 C-34 -110 -30 -132 -18 -140 C-8 -144 8 -144 18 -140 C30 -132 34 -110 32 -66Z" fill="url(#zlRKiel)" stroke="#00000030" stroke-width="1.2"/><path d="M-8 -143 L0 -132 L8 -143" stroke="#1a443a" stroke-width="3" fill="none"/><path d="M0 -132 V-70" stroke="#c9a24a" stroke-width="1.6"/><rect x="10" y="-126" width="14" height="12" rx="2" fill="#1a443a"/><path d="M14 -128 v-8 M18 -128 v-6" stroke="#c9a24a" stroke-width="2"/><path d="M-30 -78 h60" stroke="#1a443a" stroke-width="3"/><path d="M-28 -132 C-40 -112 -40 -92 -36 -76" stroke="url(#zlRKiel)" stroke-width="17" fill="none" stroke-linecap="round"/><ellipse cx="-36" cy="-70" rx="6.5" ry="7.2" fill="#e9b48c" stroke="#c48a64" stroke-width="0.91"/><path d="M-37.3 -75.8 q5.9 -0.7 5.9 4.5" stroke="#c48a64" stroke-width="0.91" fill="none" opacity=".6"/><path d="M28 -132 C40 -112 42 -96 40 -80" stroke="url(#zlRKiel)" stroke-width="17" fill="none" stroke-linecap="round"/><ellipse cx="40" cy="-74" rx="6.5" ry="7.2" fill="#e9b48c" stroke="#c48a64" stroke-width="0.91"/><path d="M38.7 -79.8 q5.9 -0.7 5.9 4.5" stroke="#c48a64" stroke-width="0.91" fill="none" opacity=".6"/><path d="M41 -74 L56 -96" stroke="#9aa0a6" stroke-width="4" stroke-linecap="round"/><circle cx="58" cy="-99" r="5" fill="none" stroke="#9aa0a6" stroke-width="3"/><rect x="-6" y="-152" width="12" height="12" fill="#c48a64"/><defs><radialGradient id="zlRSk" cx="0.42" cy="0.35" r="0.8"><stop offset="0" stop-color="#e9b48c"/><stop offset="1" stop-color="#c48a64"/></radialGradient></defs><ellipse cx="-18.1" cy="-167.5" rx="3.8" ry="4.9" fill="#e9b48c" stroke="#c48a64" stroke-width="0.95"/><ellipse cx="18.1" cy="-167.5" rx="3.8" ry="4.9" fill="#e9b48c" stroke="#c48a64" stroke-width="0.95"/><ellipse cx="0" cy="-169" rx="19" ry="20.1" fill="url(#zlRSk)" stroke="#c48a64" stroke-width="0.95"/><g class="eyes" style="animation-delay:-6.4s"><ellipse cx="-6.8" cy="-169.4" rx="2.09" ry="2.85" fill="#2a1b14"/><circle cx="-6.1" cy="-170.3" r="0.85" fill="#fff"/><path d="M-9.9 -174.5 q3.0 -1.9 6.1 0.4" stroke="#9a968e" stroke-width="1.52" fill="none" stroke-linecap="round"/><ellipse cx="6.8" cy="-169.4" rx="2.09" ry="2.85" fill="#2a1b14"/><circle cx="7.6" cy="-170.3" r="0.85" fill="#fff"/><path d="M3.8 -174.5 q3.0 -1.9 6.1 0.4" stroke="#9a968e" stroke-width="1.52" fill="none" stroke-linecap="round"/></g><ellipse cx="-10.5" cy="-163.3" rx="3.2" ry="2.1" fill="#e48a76" opacity=".55"/><ellipse cx="10.5" cy="-163.3" rx="3.2" ry="2.1" fill="#e48a76" opacity=".55"/><ellipse cx="0" cy="-165.2" rx="2.7" ry="2.1" fill="#c48a64" opacity=".7"/><circle cx="-0.8" cy="-166.0" r="0.76" fill="#fff" opacity=".6"/><path d="M-5.7 -159.9 q5.7 4.9 11.4 0" stroke="#8a3a2a" stroke-width="1.33" fill="none" stroke-linecap="round"/><ellipse cx="-4" cy="-184" rx="8" ry="4" fill="#fff" opacity=".22"/><path d="M-17.5 -182 C-20 -176 -20.5 -170 -19.5 -164 M17.5 -182 C20 -176 20.5 -170 19.5 -164" stroke="#d4d2cc" stroke-width="4.5" fill="none" stroke-linecap="round"/><g fill="#ffffff22" stroke="#2a2420" stroke-width="1.52"><rect x="-13.3" y="-175.1" width="12.9" height="11.4" rx="5.7"/><rect x="0.4" y="-175.1" width="12.9" height="11.4" rx="5.7"/></g><path d="M-0.4 -169.4 q0.4 -1.5 0.8 0 M-13.3 -169.4 l-9.5 -1.0 M13.3 -169.4 l9.5 -1.0" stroke="#2a2420" stroke-width="1.33" fill="none"/></g></g><!-- @einde roelof -->
  </g></g>

  <rect width="1600" height="900" fill="url(#zlVign)" pointer-events="none" />

  <!-- klikvlakken -->
  <g class="hits">
    <rect class="hit" data-hs="trap" data-label="De trap naar beneden" x="0" y="550" width="230" height="350" fill="transparent" />
    <rect class="hit" data-hs="thedema" data-label="Kamer Thedema" x="286" y="334" width="128" height="306" fill="transparent" />
    <rect class="hit" data-hs="alma" data-label="Kamer Alma" x="606" y="334" width="128" height="306" fill="transparent" />
    <rect class="hit" data-hs="folkerda" data-label="Kamer Folkerda" x="986" y="334" width="128" height="306" fill="transparent" />
    <rect class="hit" data-hs="luik" data-label="Het oude hooiluik" x="1180" y="250" width="290" height="280" fill="transparent" />
    <rect class="hit" data-hs="katrol" data-label="De katrol aan de hijsbalk" x="1370" y="196" width="80" height="80" fill="transparent" />
    <rect class="hit" data-hs="kast" data-label="Een kastje in de stijl" x="862" y="398" width="52" height="124" fill="transparent" />
    <rect class="hit" data-hs="gebint" data-label="Het eiken gebint" x="470" y="200" width="56" height="440" fill="transparent" />
    <rect class="hit" data-hs="ankerbalk" data-label="De ankerbalk" x="0" y="150" width="540" height="48" fill="transparent" />
    <rect class="hit" data-hs="nest" data-label="Een zwaluwnest" x="550" y="176" width="80" height="34" fill="transparent" />
    <rect class="hit" data-hs="vork" data-label="Een oude hooivork" x="1124" y="216" width="52" height="392" fill="transparent" />
    <rect class="hit" data-hs="folders" data-label="Een koelkastje met folders" x="752" y="490" width="92" height="150" fill="transparent" />
    <rect class="hit" data-hs="quiltzl" data-label="Een quilt aan de muur" x="752" y="300" width="92" height="120" fill="transparent" />
    <rect class="hit" data-hs="baal" data-label="Een baal stro" x="560" y="686" width="140" height="70" fill="transparent" />
    <rect class="hit" id="hit-zlpaardje" data-hs="paardje" data-label="Een houten hobbelpaardje" x="610" y="656" width="44" height="36" fill="transparent" />
    <rect class="hit" id="hit-zlkist" data-hs="zlkist" data-label="Roelofs gereedschapskist" x="1186" y="572" width="158" height="92" fill="transparent" />
    <rect class="hit" id="hit-zlroelof" data-hs="roelof" data-label="Roelof" x="1470" y="540" width="120" height="250" fill="transparent" />
  </g>
</svg>
