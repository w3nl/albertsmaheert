# Bouwt de apps van de escaperoom (src/escaperoom), met het spel erin, zodat het ook zonder internet werkt:
#   - Android: telefoon, tablet, Google TV en Chromebook (.apk; met een vaste sleutel ook een .aab voor Google Play)
#   - Linux: een snap (voor de Snap Store en het App Center van Ubuntu)
#   - Chrome: een extensie (.zip, voor de Chrome Web Store en Chromebooks)
# Elke build bewaart de apps als artefact (Actions → deze run → Artifacts). Een release met de apps komt er pas als de
# repository-variabele ESCAPEROOM_RELEASE op "true" staat: de escaperoom is nog verborgen tot hij is goedgekeurd.
# Zie docs/escaperoom-apps.md.
name: Escaperoom-apps

on:
  push:
    branches: [main]
    paths: ['src/escaperoom/**', 'apps/escaperoom/**', 'tools/escaperoom/build-apps.js', '.github/workflows/escaperoom-apps.yml']
  pull_request:
    paths: ['src/escaperoom/**', 'apps/escaperoom/**', 'tools/escaperoom/build-apps.js', '.github/workflows/escaperoom-apps.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escaperoom-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android-app (telefoon, tablet, Google TV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'albertsmaheert' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Zet het spel in de app
        run: |
          # de Android SDK staat al op de runner van GitHub
          echo "sdk.dir=$ANDROID_HOME" > apps/escaperoom/android/local.properties
          node tools/escaperoom/build-apps.js android
          echo "GAME_VERSION=$(grep -oP 'GAME_VERSION = \K[0-9]+' src/escaperoom/js/boot.js)" >> "$GITHUB_ENV"

      - name: Vaste sleutel (optioneel, zodat een nieuwe versie over de oude heen installeert)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # verdraagt regeleinden en spaties in de geplakte tekst
          printf '%s' "$KEYSTORE" | tr -d ' \r\n\t' | python3 -c 'import base64,sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))' > apps/escaperoom/android/keystore.jks
          if ! keytool -list -keystore apps/escaperoom/android/keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::De sleutel gaat niet open: controleer ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD en de alias ($ANDROID_KEY_ALIAS). Zie docs/escaperoom-sleutels.md."
            exit 1
          fi

      - name: Bouw de app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p apps/escaperoom/android assembleDebug --no-daemon
          cp apps/escaperoom/android/app/build/outputs/apk/debug/app-debug.apk albertsmaheert.apk

      # Voor Google Play: een ondertekende bundel (.aab). Zonder sleutel bouwen we hem wel (zodat fouten meteen opvallen),
      # maar bewaren we hem niet: Google Play neemt geen onondertekende bundel aan.
      - name: Bouw de bundel voor Google Play (.aab)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p apps/escaperoom/android bundleRelease --no-daemon
          if [ "$HAS_KEY" = "true" ]; then cp apps/escaperoom/android/app/build/outputs/bundle/release/app-release.aab albertsmaheert.aab; fi

      - name: Bewaar de app
        uses: actions/upload-artifact@v7
        with:
          name: escaperoom-android
          path: albertsmaheert.apk
          retention-days: 30

      # De bundel is niet openbaar (iedereen met een GitHub-account kan artefacten van een openbare repository downloaden):
      # alleen in een 7z-bestand met het wachtwoord van de sleutel, en nooit in de release.
      - name: Versleutel de bundel voor Google Play
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          command -v 7z > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq 7zip; }
          7z a -t7z -mhe=on -p"$ANDROID_KEYSTORE_PASSWORD" albertsmaheert-google-play.7z albertsmaheert.aab > /dev/null
          rm albertsmaheert.aab

      - name: Bewaar de bundel voor Google Play (met wachtwoord)
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: escaperoom-google-play
          path: albertsmaheert-google-play.7z
          retention-days: 7

  linux:
    name: Linux-app (snap)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_STORE: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Zet het spel in de app
        run: node tools/escaperoom/build-apps.js linux
      - name: Installeer de hulpmiddelen
        working-directory: apps/escaperoom/linux
        run: npm ci --no-audit --no-fund
      - name: Bouw de snap
        working-directory: apps/escaperoom/linux
        run: |
          npx electron-builder --linux snap --publish never
          cp dist/*.snap ../../../albertsmaheert.snap
      - name: Bewaar de snap
        uses: actions/upload-artifact@v7
        with:
          name: escaperoom-linux
          path: albertsmaheert.snap
          retention-days: 30

      # De Snap Store: alleen met een login (het secret SNAPCRAFT_STORE_CREDENTIALS) én pas na goedkeuring
      # (ESCAPEROOM_RELEASE=true). Naar het kanaal "edge" (of de variabele SNAP_CHANNEL); naar "stable" zet je hem zelf.
      - name: Zet de snap in de Snap Store
        if: env.HAS_STORE == 'true' && vars.ESCAPEROOM_RELEASE == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          sudo snap install snapcraft --classic
          snapcraft upload --release="${{ vars.SNAP_CHANNEL || 'edge' }}" albertsmaheert.snap

  chrome:
    name: Chrome-extensie
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Maak de extensie
        run: node tools/escaperoom/build-apps.js chrome
      - name: Bewaar de extensie
        uses: actions/upload-artifact@v7
        with:
          name: escaperoom-chrome
          path: dist/albertsmaheert-chrome.zip
          retention-days: 30

  # Pas als de escaperoom is goedgekeurd: zet de repository-variabele ESCAPEROOM_RELEASE op "true".
  # Elke spelversie krijgt één release "escaperoom-v1.<GAME_VERSION>.0" met alle apps; een versie die al een release
  # heeft, blijft zoals hij is.
  release:
    name: Release met de apps
    needs: [android, linux, chrome]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ESCAPEROOM_RELEASE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: escaperoom-*
          merge-multiple: true
      - name: Maak de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'GAME_VERSION = \K[0-9]+' src/escaperoom/js/boot.js)
          TAG="escaperoom-v1.$V.0"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::De release $TAG bestaat al; bouw een nieuwe spelversie voor een nieuwe release."
            exit 0
          fi
          gh release create "$TAG" albertsmaheert.apk albertsmaheert.snap albertsmaheert-chrome.zip --target "$GITHUB_SHA" \
            --title "Escaperoom-apps 1.$V.0" \
            --notes "Het Geheim van de Albertsmaheert als app: Android (telefoon, tablet, Google TV, Chromebook), Linux (snap) en Chrome-extensie. Installeren: zie docs/escaperoom-apps.md."
